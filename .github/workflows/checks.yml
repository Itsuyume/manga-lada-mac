name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r scripts/requirements-checks.txt
      - run: python3 scripts/check_balloon_geometry.py
      - run: python3 scripts/check_text_region_kind.py
      - run: python3 scripts/check_effect_catalog.py
      - run: python3 scripts/check_optical_effects.py
      - run: python3 scripts/check_sentence_punctuation.py
      - run: python3 scripts/check_flat_backgrounds.py
      - run: python3 scripts/check_supplemental_mask.py
      - run: brew install swiftlint
      - run: python3 scripts/check_architecture.py
      - run: swiftlint lint --strict
      - run: swift build --explicit-target-dependency-import-check error
      - name: Packaged punctuation behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          binary_directory = Path(subprocess.check_output(["swift", "build", "--show-bin-path"], text=True).strip())
          workers = list(binary_directory.rglob("japanese_engine_worker.py"))
          assert len(workers) == 1, "Expected one packaged OCR worker"
          subprocess.run(["python3", "scripts/check_sentence_punctuation.py", "--resources", str(workers[0].parent)], check=True)
          subprocess.run([str(binary_directory / "MangaLadaBallonsChecks"), "--resource-integrity", sys.executable, str(workers[0].parent)], check=True)
          PY
      - run: swift run MangaLadaCoreChecks
      - run: swift run -c release MangaLadaCoreChecks
      - run: swift run MangaLadaVisionChecks
      - run: swift run MangaLadaWorkflowChecks --cache-migration
      - run: swift run MangaLadaBallonsChecks --session-lifetime
      - name: Rendering behavior checks
        timeout-minutes: 4
        run: |
          python3 - <<'PY'
          import subprocess
          import sys
          check = subprocess.Popen([".build/debug/MangaLadaRenderingChecks"])
          try:
              sys.exit(check.wait(timeout=120))
          except subprocess.TimeoutExpired:
              print("Rendering checks exceeded 120 seconds; collecting a stack sample.", flush=True)
              try:
                  subprocess.run(["sample", str(check.pid), "3"], timeout=15, check=False)
              finally:
                  check.kill()
                  check.wait()
              sys.exit(124)
          PY
      - run: swift run MangaLadaImportChecks
        timeout-minutes: 4
      - run: scripts/check_viewer_images.sh
        timeout-minutes: 4
      - run: scripts/check_file_panel.sh
        timeout-minutes: 4
      - run: scripts/check_translation_state.sh
        timeout-minutes: 4
